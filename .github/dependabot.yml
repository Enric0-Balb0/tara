# Aggiornamenti delle dipendenze: una PR raggruppata per ecosistema ogni lunedì.
# I titoli seguono Conventional Commits, così passano il controllo sul titolo della PR.
version: 2

updates:
  # App mobile. Le dipendenze dell'SDK Expo e di React Native si aggiornano solo con
  # `npx expo install --fix` o con l'upgrade di SDK, mai a mano:
  # - react, react-dom, react-native, react-native-reanimated, react-native-worklets e
  #   react-native-svg sono fissati a una versione esatta dall'SDK (bundledNativeModules
  #   di expo): Dependabot non li tocca, nemmeno per le patch, altrimenti expo-doctor
  #   fallisce (vedi la PR #50);
  # - gli altri pacchetti dell'SDK (range ~) ricevono solo le patch;
  # - eslint resta sulla major supportata da eslint-config-expo (ESLint 10 rompe
  #   eslint-plugin-react: vedi la PR #4);
  # - @types/node segue la major di Node in .nvmrc (e in CI): sale solo insieme a Node.
  - package-ecosystem: npm
    directory: /apps/mobile
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "react"
      - dependency-name: "react-dom"
      - dependency-name: "react-native"
      - dependency-name: "react-native-reanimated"
      - dependency-name: "react-native-worklets"
      - dependency-name: "react-native-svg"
      - dependency-name: "expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "expo-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint-config-expo"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "@types/react"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "react-native-*"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]
      - dependency-name: "eslint"
        update-types: ["version-update:semver-major"]
      # Segue .nvmrc: i tipi di Node 26 descrivono API che il runtime 22 non ha.
      - dependency-name: "@types/node"
        update-types: ["version-update:semver-major"]
    groups:
      mobile:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: chore
      include: scope
    groups:
      api:
        patterns: ["*"]

  - package-ecosystem: uv
    directory: /pipelines/catalog
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: chore
      include: scope
    groups:
      catalog:
        patterns: ["*"]

  # Immagini base del Dockerfile: si resta su Python 3.12 finché non si decide di salire.
  - package-ecosystem: docker
    directory: /services/api
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: chore
      include: scope
    ignore:
      - dependency-name: "python"
        update-types: ["version-update:semver-major", "version-update:semver-minor"]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
      timezone: Europe/Rome
    commit-message:
      prefix: ci
      include: scope
    groups:
      actions:
        patterns: ["*"]
