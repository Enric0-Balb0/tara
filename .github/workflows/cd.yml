# Delivery del backend, quando la CI su main è verde:
# 1. pubblica l'immagine dell'API su GitHub Container Registry con il tag dello SHA e "latest";
# 2. applica le migrazioni al database di Supabase, dalla stessa immagine;
# 3. chiede a Render di distribuire l'immagine di quello SHA e aspetta di vederla online;
# 4. lancia la collezione Postman sull'API online.
# Regole per le migrazioni e segreti: docs/processo.md, sezioni "Delivery" e "Segreti".
name: CD

on:
  workflow_run:
    workflows: [CI]
    types: [completed]
    branches: [main]

permissions:
  contents: read

concurrency:
  group: cd-api
  cancel-in-progress: false

env:
  # Non è un segreto: lo contiene anche l'app (apps/mobile/eas.json).
  API_URL: https://tara-api-eu.onrender.com
  SHA: ${{ github.event.workflow_run.head_sha }}

jobs:
  api-image:
    name: Pubblica immagine API
    if: github.event.workflow_run.conclusion == 'success' && github.event.workflow_run.event == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    outputs:
      image: ${{ steps.image.outputs.ref }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
      - name: Nome dell'immagine
        id: image
        # GHCR accetta solo nomi in minuscolo; il proprietario del repository non lo è.
        run: |
          echo "IMAGE=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tara-api" >> "$GITHUB_ENV"
          echo "ref=ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tara-api:$SHA" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        id: meta
        with:
          images: ${{ env.IMAGE }}
          tags: |
            type=raw,value=${{ env.SHA }}
            type=raw,value=latest
      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: services/api
          push: true
          build-args: RELEASE=${{ env.SHA }}
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          cache-from: type=gha,scope=api

  api-deploy:
    name: Deploy API su Render
    needs: api-image
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      packages: read
    env:
      IMAGE_REF: ${{ needs.api-image.outputs.image }}
    # I segreti stanno solo negli env degli step che li usano.
    steps:
      - name: Segreti impostati
        env:
          TARA_DATABASE_URL: ${{ secrets.TARA_DATABASE_URL }}
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: |
          missing=0
          for name in TARA_DATABASE_URL RENDER_DEPLOY_HOOK_URL; do
            if [ -z "${!name}" ]; then
              echo "::error::Manca il segreto $name: vedi docs/processo.md, sezione Segreti."
              missing=1
            fi
          done
          exit "$missing"
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Migrazioni del database
        # Partono prima del deploy: ogni migrazione deve funzionare anche con l'immagine
        # ancora online. Il session pooler di Supabase è raggiungibile in IPv4 dai runner.
        env:
          TARA_DATABASE_URL: ${{ secrets.TARA_DATABASE_URL }}
        run: docker run --rm -e TARA_DATABASE_URL "$IMAGE_REF" alembic upgrade head
      - name: Deploy su Render
        # L'URL dell'hook contiene già ?key=: -G aggiunge imgURL come secondo parametro.
        env:
          RENDER_DEPLOY_HOOK_URL: ${{ secrets.RENDER_DEPLOY_HOOK_URL }}
        run: curl -fsS -o /dev/null -G --data-urlencode "imgURL=$IMAGE_REF" "$RENDER_DEPLOY_HOOK_URL"
      - name: Nuova release online
        # Render tiene online la release precedente finché la nuova non passa l'health
        # check, quindi si aspetta che /health riporti questo SHA. Durante il risveglio
        # Render risponde 503 o con una pagina HTML: si riprova fino a 10 minuti.
        run: |
          deadline=$((SECONDS + 600))
          while true; do
            release=$(curl -fsS --max-time 60 "$API_URL/health" | jq -r '.release // empty' 2>/dev/null || true)
            if [ "$release" = "$SHA" ]; then
              break
            fi
            if [ "$SECONDS" -ge "$deadline" ]; then
              echo "::error::Dopo 10 minuti /health riporta '${release:-nessuna risposta}' invece di $SHA."
              exit 1
            fi
            echo "Online: ${release:-nessuna risposta}. Nuovo controllo tra 15 s."
            sleep 15
          done
          curl -fsS --retry 4 --retry-all-errors --retry-delay 10 --max-time 60 "$API_URL/ready" \
            | jq -e '.status == "ok"'

  api-postman:
    name: Collezione Postman online
    needs: api-deploy
    runs-on: ubuntu-latest
    timeout-minutes: 10
    # Newman è codice npm di terze parti: gira in un job senza segreti né token.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ env.SHA }}
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
      - name: Newman sull'API online
        run: >-
          npx --yes newman@6.2.1 run services/api/postman/tara-api.postman_collection.json
          -e services/api/postman/render.postman_environment.json
