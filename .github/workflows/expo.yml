# Compatibilità con l'SDK Expo, ogni giorno su main.
# expo-doctor confronta il lockfile con le ultime patch pubblicate da Expo: quando Expo ne
# rilascia di nuove il controllo fallisce senza che il nostro codice sia cambiato. Per questo
# non blocca le PR (in ci.yml gira solo quando cambiano le dipendenze dell'app): qui apre o
# aggiorna una issue con il comando per allinearsi, e la chiude quando torna tutto verde.
name: Compatibilità Expo

on:
  schedule:
    - cron: "17 6 * * *"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  group: expo-doctor
  cancel-in-progress: true

jobs:
  doctor:
    name: expo-doctor su main
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/mobile
    env:
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
      ISSUE_TITLE: Dipendenze Expo da aggiornare
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: apps/mobile/package-lock.json
      - run: npm ci
      - name: expo-doctor
        id: doctor
        run: |
          set +e
          npm run doctor > doctor.txt 2>&1
          echo "status=$?" >> "$GITHUB_OUTPUT"
          cat doctor.txt
      - name: Apri o aggiorna la issue
        if: steps.doctor.outputs.status != '0'
        run: |
          {
            echo "expo-doctor segnala versioni non allineate all'SDK Expo installato."
            echo
            echo '```'
            tail -n 40 doctor.txt
            echo '```'
            echo
            echo 'Per allinearsi: `cd apps/mobile; npx expo install --fix`, verifica con'
            echo '`npm run doctor` e apri una PR `chore(deps): update Expo SDK patches`.'
          } > issue.md
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue edit "$number" --body-file issue.md
          else
            gh issue create --title "$ISSUE_TITLE" --body-file issue.md
          fi
      - name: Chiudi la issue se è tutto allineato
        if: steps.doctor.outputs.status == '0'
        run: |
          number=$(gh issue list --state open --search "in:title \"$ISSUE_TITLE\"" --json number --jq '.[0].number')
          if [ -n "$number" ]; then
            gh issue close "$number" --comment "expo-doctor è di nuovo verde."
          fi
