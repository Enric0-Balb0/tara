# Diario (RF-40, RF-41, RF-42, RF-45; serve il backend per il primo download): da "Aggiungi"
# sotto Pranzo cerco albume e ne registro 200 g; la voce compare nel pasto con i valori giusti.
# Poi la porto a 250 g, ritrovo 250 g come ultima quantità a pranzo, la elimino e passo a ieri.
appId: com.enricobalbo.tara
name: Diario di oggi
tags:
  - api
---
- runFlow: subflows/avvio.yaml
- runFlow: subflows/accedi.yaml
- extendedWaitUntil:
    visible:
      id: diario
    timeout: 30000
- assertVisible: Colazione
- assertVisible: Pranzo

# Aggiungere a un pasto preciso.
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: Aggiungi a Pranzo
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: albume
# Il primo download comprende circa 3500 alimenti: la ricerca riparte quando arrivano.
- extendedWaitUntil:
    visible: "Albume d'uovo in polvere"
    timeout: 90000
- tapOn:
    text: "Albume d'uovo"
    index: 0
- extendedWaitUntil:
    visible: Aggiungi a Pranzo
    timeout: 10000
- tapOn: Aggiungi a Pranzo
- tapOn:
    id: tasto-2
- tapOn:
    id: tasto-0
- tapOn:
    id: tasto-0
- assertVisible: Aggiungi 200 grammi
- takeScreenshot: screenshots/diario-foglio
- tapOn: Aggiungi 200 grammi

# Di nuovo in Oggi: la voce con peso, kcal e proteine per 200 g.
- runFlow:
    file: subflows/vedi.yaml
    env:
      ELEMENTO: 'Albume d''uovo, 200 grammi, 96 kcal, 21,8 grammi di proteine'
- assertVisible: 96 kcal
- takeScreenshot: screenshots/diario-voce

# Un tocco sulla voce: si cambia il peso.
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: 'Albume d''uovo, 200 grammi, 96 kcal, 21,8 grammi di proteine'
- tapOn:
    id: tasto-delete
- tapOn:
    id: tasto-delete
- tapOn:
    id: tasto-delete
- tapOn:
    id: tasto-2
- tapOn:
    id: tasto-5
- tapOn:
    id: tasto-0
- tapOn: Salva 250 grammi
- runFlow:
    file: subflows/vedi.yaml
    env:
      ELEMENTO: 'Albume d''uovo, 250 grammi, 120 kcal, 27,3 grammi di proteine'

# L'ultima quantità usata a pranzo per lo stesso alimento (RF-42).
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: Aggiungi a Pranzo
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: albume
- tapOn:
    text: "Albume d'uovo"
    index: 0
- tapOn: Aggiungi a Pranzo
- assertVisible: 'Ultima volta a pranzo: 250 g'
- tapOn: Chiudi
- tapOn: Indietro
- back
- extendedWaitUntil:
    visible:
      id: diario
    timeout: 10000

# Eliminare la voce.
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: 'Albume d''uovo, 250 grammi, 120 kcal, 27,3 grammi di proteine'
- tapOn: Elimina dal diario
- extendedWaitUntil:
    notVisible: "Albume d'uovo, 250 grammi, 120 kcal, 27,3 grammi di proteine"
    timeout: 10000

# "Aggiungi e continua" torna ai risultati con il pasto scelto sulla scheda.
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: Aggiungi a Pranzo
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: albume
- tapOn:
    text: "Albume d'uovo"
    index: 0
- tapOn: Cena
- tapOn: Aggiungi a Cena
- tapOn:
    id: tasto-1
- tapOn:
    id: tasto-0
- tapOn:
    id: tasto-0
- tapOn: Aggiungi e continua
- extendedWaitUntil:
    visible: "Albume d'uovo in polvere"
    timeout: 10000
- tapOn:
    text: "Albume d'uovo"
    index: 0
- assertVisible: Aggiungi a Cena
- tapOn: Indietro
- back
- extendedWaitUntil:
    visible:
      id: diario
    timeout: 10000
# Cena è in fondo: si scende fino alla voce, poi si torna su.
- scrollUntilVisible:
    element: "Albume d'uovo, 100 grammi, 48 kcal, 10,9 grammi di proteine"
- scrollUntilVisible:
    element: Giorno precedente
    direction: UP

# Gli altri giorni.
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: Giorno precedente
- assertVisible: Ieri
- runFlow:
    file: subflows/tocca.yaml
    env:
      ELEMENTO: '.*torna a oggi'
- assertVisible: Oggi
