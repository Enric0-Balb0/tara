# Smoke test: l'app si avvia su Oggi, le quattro tab aprono la schermata giusta e il
# profilo si apre dall'intestazione di Oggi. Si entra con subflows/accedi.yaml (EMAIL, OTP).
appId: com.enricobalbo.tara
name: Navigazione tra le tab
tags:
  - smoke
---
- runFlow: subflows/avvio.yaml
- runFlow: subflows/accedi.yaml
- extendedWaitUntil:
    visible:
      id: diario
    timeout: 30000
- takeScreenshot: screenshots/oggi

# Le tab per id, ritoccando se lo schermo non cambia: a volte il primo tocco si perde.
- tapOn:
    id: tab-piano
    retryTapIfNoChange: true
- assertVisible: Target di Allenamento

# Le tab per id, ritoccando se lo schermo non cambia: a volte il primo tocco si perde.
- tapOn:
    id: tab-dispensa
    retryTapIfNoChange: true
- assertVisible: Nuovo alimento

# Le tab per id, ritoccando se lo schermo non cambia: a volte il primo tocco si perde.
- tapOn:
    id: tab-andamento
    retryTapIfNoChange: true
- assertVisible:
    id: peso-pannello

# Le tab per id, ritoccando se lo schermo non cambia: a volte il primo tocco si perde.
- tapOn:
    id: tab-oggi
    retryTapIfNoChange: true
- assertVisible:
    id: diario

- tapOn: Profilo
- assertVisible: Tipi di giornata e target, fase della dieta, stack integratori e notifiche.
- assertVisible: Accesso come
- back
- assertVisible:
    id: diario
