# Smoke test: l'app si avvia su Oggi, le quattro tab aprono la schermata giusta e il
# profilo si apre dall'intestazione di Oggi.
appId: com.enricobalbo.tara
name: Navigazione tra le tab
tags:
  - smoke
---
- runFlow: subflows/avvio.yaml
- extendedWaitUntil:
    visible: Diario di oggi
    timeout: 30000
- takeScreenshot: screenshots/oggi

- tapOn: Piano
- assertVisible: Pasti, alimenti e grammi per ogni tipo di giornata.

- tapOn: Dispensa
- assertVisible: I tuoi alimenti, le ricette e i pasti salvati.

- tapOn: Andamento
- assertVisible: Peso con media mobile, misure, foto e check-in settimanale.

- tapOn: Oggi
- assertVisible: Diario di oggi

- tapOn: Profilo
- assertVisible: Tipi di giornata e target, fase della dieta, stack integratori e notifiche.
- back
- assertVisible: Diario di oggi
