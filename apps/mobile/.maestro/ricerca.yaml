# Ricerca e scheda alimento (serve il backend per il primo download: quello locale con la
# development build, quello su Render con la build preview):
# cerco albume, vedo i valori giusti e la fonte, passo al cotto dal foglio dei grammi. Il crudo
# viene prima del cotto. L'aggiunta al diario è nel flusso diario.yaml.
appId: com.enricobalbo.tara
name: Ricerca e scheda alimento
tags:
  - api
---
- runFlow: subflows/avvio.yaml
- runFlow: subflows/accedi.yaml
- extendedWaitUntil:
    visible:
      id: diario
    timeout: 30000
- tapOn: Cerca un alimento
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: albume
# Il primo download comprende circa 3500 alimenti: la ricerca riparte quando arrivano.
- extendedWaitUntil:
    visible: "Albume d'uovo in polvere"
    timeout: 90000
- assertVisible: cotto
- takeScreenshot: screenshots/ricerca-albume
- tapOn:
    text: "Albume d'uovo"
    index: 0
- extendedWaitUntil:
    visible: per 100 g
    timeout: 10000
- assertVisible: '10,9 g'
- assertVisible: 'Fonte: CIQUAL 2025 \(Anses\)'
- assertNotVisible: cotto
- takeScreenshot: screenshots/scheda-albume

# Dalla barra di ricerca il pasto è quello con l'orario più vicino: il nome cambia con l'ora.
- assertVisible: 'Aggiungi a (Colazione|Spuntino|Pranzo|Merenda|Cena)'
# Il foglio passa alla variante cotta dello stesso alimento.
- tapOn: 'Aggiungi a (Colazione|Spuntino|Pranzo|Merenda|Cena)'
- tapOn: Cotto
- tapOn: Chiudi
- assertVisible: '10,3 g'
- assertVisible: cotto

# I cotti con lo stesso nome si distinguono per la cottura.
- tapOn: Indietro
- tapOn: Cancella la ricerca
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: broccoli
- extendedWaitUntil:
    visible: al vapore
    timeout: 10000
- assertVisible: lessato
- takeScreenshot: screenshots/ricerca-broccoli

# Senza accenti si trova lo stesso.
- tapOn: Cancella la ricerca
- runFlow:
    file: subflows/scrivi.yaml
    env:
      CAMPO: campo-ricerca
      TESTO: baba
- extendedWaitUntil:
    visible: 'Babà al rum'
    timeout: 10000
