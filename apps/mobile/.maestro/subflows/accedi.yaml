# Accede con un codice già pronto, senza chiederne uno nuovo: "Ho già un codice".
# Servono le variabili EMAIL e OTP: le passa scripts/e2e.mjs, che prima di ogni flusso
# chiede a Supabase Auth un codice nuovo con la chiave segreta (API admin, nessuna email).
# L'app non ha scorciatoie per i test.
appId: com.enricobalbo.tara
---
- extendedWaitUntil:
    visible: Accedi a Tara
    timeout: 30000
- tapOn:
    id: campo-email
- runFlow:
    file: scrivi.yaml
    env:
      CAMPO: campo-email
      TESTO: ${EMAIL}
- hideKeyboard
- tapOn: Ho già un codice
- extendedWaitUntil:
    visible:
      id: campo-codice
    timeout: 10000
- tapOn:
    id: campo-codice
- runFlow:
    file: scrivi.yaml
    env:
      CAMPO: campo-codice
      TESTO: ${OTP}
- hideKeyboard
- tapOn: Verifica
