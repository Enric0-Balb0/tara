# Accede con un codice già pronto, senza chiederne uno nuovo: "Ho già un codice".
# Servono le variabili EMAIL e OTP. Il codice lo genera lo script E2E con la chiave
# segreta di Supabase (link di accesso creato dall'amministratore, nessuna email): l'app
# non ha scorciatoie per i test. Finché lo script non lo fa, i flussi che chiamano questo
# sottoflusso non possono girare.
appId: com.enricobalbo.tara
---
- extendedWaitUntil:
    visible: Accedi a Tara
    timeout: 30000
- tapOn:
    id: campo-email
- inputText: ${EMAIL}
- hideKeyboard
- tapOn: Ho già un codice
- extendedWaitUntil:
    visible:
      id: campo-codice
    timeout: 10000
- tapOn:
    id: campo-codice
- inputText: ${OTP}
- hideKeyboard
- tapOn: Verifica
