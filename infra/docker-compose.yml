# Ambiente locale: Postgres 17 con pgvector e, a richiesta, il backend nella stessa
# immagine che va in produzione.
# Solo database:      docker compose -f infra/docker-compose.yml up -d
# Database e backend: docker compose -f infra/docker-compose.yml --profile api up -d --build
services:
  db:
    image: pgvector/pgvector:pg17
    environment:
      POSTGRES_USER: tara
      POSTGRES_PASSWORD: tara
      POSTGRES_DB: tara
    ports:
      - "5432:5432"
    volumes:
      - tara-db:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U tara -d tara"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    profiles: [api]
    build: ../services/api
    environment:
      TARA_ENVIRONMENT: development
      TARA_DATABASE_URL: postgresql://tara:tara@db:5432/tara
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy

volumes:
  tara-db:
