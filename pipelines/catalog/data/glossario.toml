# Glossario controllato per la traduzione dei nomi del catalogo (CIQUAL fr/en, USDA en).
#
# Ogni voce collega i termini delle fonti alla forma italiana da usare nel nome.
# `state` (facoltativo) dice cosa il termine implica sullo stato dell'alimento:
#   "raw" | "cooked", come la colonna `food.state` del database. Se manca, il termine
#   non dice nulla sullo stato.
# I validatori usano `state` per mandare in revisione le traduzioni incoerenti.

[[term]]
it = "crudo"
en = ["raw"]
fr = ["cru", "crue", "crus", "crues"]
state = "raw"

[[term]]
it = "cotto"
en = ["cooked"]
fr = ["cuit", "cuite", "cuits", "cuites"]
state = "cooked"

[[term]]
it = "lessato"
en = ["boiled", "cooked in water"]
fr = ["bouilli", "bouillie", "cuit à l'eau", "cuite à l'eau"]
state = "cooked"

[[term]]
it = "al vapore"
en = ["steamed"]
fr = ["cuit à la vapeur", "cuite à la vapeur"]
state = "cooked"

[[term]]
it = "arrosto"
en = ["roasted"]
fr = ["rôti", "rôtie"]
state = "cooked"

[[term]]
it = "alla griglia"
en = ["grilled"]
fr = ["grillé", "grillée"]
state = "cooked"

[[term]]
it = "fritto"
en = ["fried"]
fr = ["frit", "frite"]
state = "cooked"

[[term]]
it = "al forno"
en = ["baked", "oven-baked"]
fr = ["cuit au four", "cuite au four"]
state = "cooked"

[[term]]
it = "in padella"
en = ["pan-fried", "sauteed"]
fr = ["poêlé", "poêlée"]
state = "cooked"

[[term]]
it = "sgocciolato"
en = ["drained"]
fr = ["égoutté", "égouttée"]

[[term]]
it = "in scatola"
en = ["canned"]
fr = ["appertisé", "appertisée"]

[[term]]
it = "surgelato"
en = ["frozen"]
fr = ["surgelé", "surgelée"]

[[term]]
it = "essiccato"
en = ["dried"]
fr = ["séché", "séchée", "déshydraté", "déshydratée"]

[[term]]
it = "senza pelle"
en = ["skinless", "without skin"]
fr = ["sans peau"]

[[term]]
it = "con pelle"
en = ["with skin"]
fr = ["avec peau"]

[[term]]
it = "intero"
en = ["whole"]
fr = ["entier", "entière"]

[[term]]
it = "scremato"
en = ["skimmed"]
fr = ["écrémé", "écrémée"]

[[term]]
it = "parzialmente scremato"
en = ["semi-skimmed"]
fr = ["demi-écrémé", "demi-écrémée"]
