[project]
name = "tara-catalog"
version = "0.1.0"
description = "Pipeline del catalogo di Tara: import CIQUAL/USDA, traduzione e validazione"
requires-python = ">=3.12,<3.13"
dependencies = [
    "defusedxml>=0.7.1",
    "pydantic-ai-slim[anthropic,google,openai]>=2.60",
    "python-dotenv>=1.2.4",
]

[dependency-groups]
dev = [
    "mypy>=1.20",
    "pytest>=9.1",
    "pytest-cov>=7.0",
    "ruff>=0.17",
    "types-defusedxml>=0.7.0.20260504",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = ["--strict-markers"]
# Avviso interno di pydantic_graph con run_sync su Python 3.12: non dipende dal nostro codice.
filterwarnings = ["ignore:There is no current event loop:DeprecationWarning:pydantic_graph"]

[tool.coverage.run]
source = ["tara_catalog"]
branch = true

[tool.coverage.report]
fail_under = 80
show_missing = true
skip_covered = true

[tool.mypy]
strict = true
files = ["src", "tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
