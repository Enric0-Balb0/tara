[project]
name = "tara-api"
version = "0.1.0"
description = "Backend di Tara: sincronizzazione, gateway AI e proxy Open Food Facts"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.159",
    "pydantic-settings>=2.16",
    "uvicorn[standard]>=0.54",
]

[project.optional-dependencies]
dev = [
    "httpx2>=2.16",
    "pytest>=9.1",
    "ruff>=0.17",
]

[build-system]
requires = ["setuptools>=75"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
